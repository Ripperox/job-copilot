services:
  - type: web
    name: shortlist-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx tsc --noEmit
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # REQUIRED - Add these in Render dashboard after first deploy:
      # - GROQ_API_KEY (or NEMOTRON_API_KEY)
      # - SESSION_SECRET (generate: openssl rand -hex 32)
      # - KEY_ENCRYPTION_SECRET (generate: openssl rand -hex 32)
      # - GOOGLE_CLIENT_ID
      # - GOOGLE_CLIENT_SECRET
      # - OAUTH_REDIRECT_URL (https://your-render-url.onrender.com/api/auth/google/callback)
      # - FRONTEND_ORIGIN (https://your-vercel-app.vercel.app)
      # OPTIONAL job APIs:
      # - ADZUNA_APP_ID
      # - ADZUNA_APP_KEY
      # - JSEARCH_RAPIDAPI_KEY
      # - ACTIVE_JOBS_RAPIDAPI_KEY
      # - LINKEDIN_JOBS_RAPIDAPI_KEY
      # - JOOBLE_API_KEY
      # - FIRECRAWL_API_KEY
      # - TAVILY_API_KEY
      # - EXA_API_KEY
      # - JINA_API_KEY
    healthCheckPath: /api/health
    autoDeploy: true