<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Shortlist.

       The same three bars as the in-app mark (src/components/BrandMark.tsx),
       scaled onto a 32px tile: a ranked list with the top item picked out. The
       app used to show a lightning bolt here and something else entirely in its
       header, so the tab you were hunting for looked nothing like the page.

       The top bar takes the accent because in this product the accent means
       "this is the one to act on". At 16px the other two read as texture, which
       is the right amount of information for a favicon. -->
  <rect width="32" height="32" rx="7" fill="#101013"/>
  <g>
    <rect x="6" y="8"    width="20" height="4.5" rx="2.25" fill="#6366f1"/>
    <rect x="6" y="15.5" width="14" height="4.5" rx="2.25" fill="#8b8b99"/>
    <rect x="6" y="23"   width="8"  height="4.5" rx="2.25" fill="#54545e"/>
  </g>
</svg>
